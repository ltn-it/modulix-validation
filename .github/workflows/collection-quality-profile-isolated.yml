# yamllint disable rule:truthy
---
name: Isolated collection infrastructure quality profile

on:
  workflow_call:
    inputs:
      profile:
        description: Heavy or Application Acceptance profile to execute.
        required: true
        type: string
      matrix-json:
        description: Compact include matrix generated by the calling collection.
        required: true
        type: string
      candidate-artifact:
        description: Exact collection candidate artifact from the caller run.
        required: true
        type: string
      source-sha:
        description: Exact collection commit represented by the candidate.
        required: true
        type: string
      source-repository:
        description: Repository that contains the exact collection source.
        required: false
        default: ""
        type: string
      cpu-limit:
        description: Per-cell Incus CPU limit.
        required: false
        default: "4"
        type: string
      memory-limit:
        description: Per-cell Incus memory limit.
        required: false
        default: 12GiB
        type: string
      disk-limit:
        description: Per-cell Incus root disk limit.
        required: false
        default: 24GiB
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate delegated profile contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.contract.outputs.profile }}
    steps:
      - id: contract
        name: Validate profile and exact candidate identity
        env:
          PROFILE: ${{ inputs.profile }}
          MATRIX_JSON: ${{ inputs['matrix-json'] }}
          CALLER_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ inputs['source-repository'] || github.repository }}
          SOURCE_SHA: ${{ inputs['source-sha'] }}
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_ACTOR: ${{ github.actor }}
          CALLER_ACTOR_ID: ${{ github.actor_id }}
          CALLER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CALLER_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Hosted admission finishes before any physical worker is scheduled.
          # Only public inputs enter this offline image; no checkout, token or mount.
          docker run --rm --interactive --entrypoint "" --read-only --network none \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges=true \
            --pids-limit 128 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e PROFILE -e MATRIX_JSON -e CALLER_REPOSITORY \
            -e SOURCE_REPOSITORY -e SOURCE_SHA -e CALLER_REPOSITORY_ID \
            -e CALLER_EVENT -e CALLER_REF -e CALLER_WORKFLOW_REF \
            -e CALLER_ACTOR -e CALLER_ACTOR_ID -e CALLER_TRIGGERING_ACTOR \
            -e CALLER_ATTEMPT \
            quay.io/l-it/ee-wunder-devtools-ubi9:v1.18.2@sha256:58955457d3410706520f34fa7ea9823d5650aa4844c562cd5c0107024d825711 \
            bash -euo pipefail -s >> "$GITHUB_OUTPUT" <<'CONTRACT'
          set -euo pipefail
          test "$CALLER_REPOSITORY" = ltn-it/modulix-validation
          test "$CALLER_REPOSITORY_ID" = 1269461997
          test "$CALLER_EVENT" = workflow_dispatch
          test "$CALLER_REF" = refs/heads/main
          test "$CALLER_WORKFLOW_REF" = ltn-it/modulix-validation/.github/workflows/mlx90-collection-candidate-validation.yml@refs/heads/main
          test "$CALLER_ACTOR" = 'lightning-it-release-automation[bot]'
          test "$CALLER_ACTOR_ID" = 307565056
          test "$CALLER_TRIGGERING_ACTOR" = "$CALLER_ACTOR"
          test "$CALLER_ATTEMPT" = 1
          test "$SOURCE_REPOSITORY" = ltn-it/ansible-collection-supplementary
          case "$PROFILE" in
            heavy|application_acceptance) ;;
            *) echo "unsupported delegated profile: $PROFILE" >&2; exit 1 ;;
          esac
          [[ "$CALLER_REPOSITORY" =~ ^ltn-it/[A-Za-z0-9_.-]+$ ]] || {
            echo "workflow caller is not allowlisted" >&2
            exit 1
          }
          [[ "$SOURCE_REPOSITORY" =~ ^ltn-it/[A-Za-z0-9_.-]+$ ]] || {
            echo "source-repository is not allowlisted" >&2
            exit 1
          }
          if [[ ! "$SOURCE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "source-sha must be an exact 40- or 64-character lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          value = json.loads(os.environ["MATRIX_JSON"])
          cells = value.get("include") if isinstance(value, dict) else None
          if not isinstance(cells, list) or not cells:
              raise SystemExit("matrix-json must contain a non-empty include list")
          required = {
              "allure",
              "component",
              "instance_type",
              "junit",
              "roles",
              "runner",
              "scenario",
              "target",
          }
          for index, cell in enumerate(cells):
              if not isinstance(cell, dict):
                  raise SystemExit(f"matrix-json include[{index}] must be an object")
              missing = sorted(required - cell.keys())
              if missing:
                  raise SystemExit(f"matrix-json include[{index}] is missing: {', '.join(missing)}")
              if not isinstance(cell["runner"], (str, list)) or not cell["runner"]:
                  raise SystemExit(f"matrix-json include[{index}].runner must be non-empty")
              if not isinstance(cell["roles"], list) or not cell["roles"]:
                  raise SystemExit(f"matrix-json include[{index}].roles must be a non-empty list")
              for key in ("component", "scenario", "target", "instance_type"):
                  if not isinstance(cell[key], str) or not cell[key]:
                      raise SystemExit(f"matrix-json include[{index}].{key} must be a non-empty string")
              for key in ("junit", "allure"):
                  if not isinstance(cell[key], bool):
                      raise SystemExit(f"matrix-json include[{index}].{key} must be a boolean")
          PY
          echo "profile=$PROFILE"
          CONTRACT

  profile-cells:
    name: ${{ inputs.profile }} / ${{ matrix.scenario }} / ${{ matrix.target }}
    needs: validate-inputs
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(inputs['matrix-json']) }}
    runs-on:
      group: lit-pis-prd-isolated
      labels:
        - self-hosted
        - linux
        - x64
        - lit-pis
        - prd
        - isolated
        - ciwkr01
    environment:
      name: heavy-isolated-pilot
    timeout-minutes: 90
    concurrency:
      # A shared group can retain only one pending job; later collection
      # requests otherwise cancel an already queued required profile. Runner
      # capacity still serializes jobs that target the same physical worker.
      # The Runner service stays on ciwkr01; Incus VMs are the disposable test targets.
      group: >-
        modulix-validation-incus-${{ github.repository_id }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ inputs.profile }}-${{ matrix.scenario }}-${{
        matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Run prepared Incus cell through the installed host runtime
        uses: ltn-it/modulix-validation/.github/actions/run-incus-runtime-profile@dd1b8859b30b5e40b1d166ee25c8e5e5f4113675
        with:
          profile: ${{ needs.validate-inputs.outputs.profile }}
          scenario: ${{ matrix.scenario }}
          target: ${{ matrix.target }}
          target-disposition: ${{ matrix.target_disposition || 'supported' }}
          roles: ${{ join(matrix.roles, ',') }}
          image: ${{ matrix.image || vars[matrix.image_variable] }}
          instance-type: ${{ matrix.instance_type }}
          candidate-artifact: ${{ inputs['candidate-artifact'] }}
          source-sha: ${{ inputs['source-sha'] }}
          junit-required: ${{ matrix.junit }}
          allure-required: ${{ matrix.allure }}
          cpu-limit: ${{ inputs['cpu-limit'] }}
          memory-limit: ${{ inputs['memory-limit'] }}
          disk-limit: ${{ inputs['disk-limit'] }}
