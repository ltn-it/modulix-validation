# yamllint disable rule:truthy
---
name: Isolated collection infrastructure quality profile

on:
  workflow_call:
    inputs:
      operating-case:
        description: Reserved operating case; empty for the ordinary business profiles.
        required: false
        default: ""
        type: string
      profile:
        description: Heavy or Application Acceptance profile to execute.
        required: true
        type: string
      matrix-json:
        description: Compact include matrix generated by the calling collection.
        required: true
        type: string
      candidate-artifact:
        description: Exact collection candidate artifact from the caller run.
        required: true
        type: string
      source-sha:
        description: Exact collection commit represented by the candidate.
        required: true
        type: string
      source-repository:
        description: Repository that contains the exact collection source.
        required: false
        default: ""
        type: string
      cpu-limit:
        description: Per-cell Incus CPU limit.
        required: false
        default: "4"
        type: string
      memory-limit:
        description: Per-cell Incus memory limit.
        required: false
        default: 12GiB
        type: string
      disk-limit:
        description: Per-cell Incus root disk limit.
        required: false
        default: 24GiB
        type: string

permissions:
  contents: read
  checks: read

jobs:
  validate-inputs:
    name: Validate delegated profile contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.contract.outputs.profile }}
      matrix-json: ${{ steps.contract.outputs.matrix-json }}
      worker-group: ${{ steps.contract.outputs.worker-group }}
      operating-case: ${{ steps.contract.outputs.operating-case }}
    steps:
      - id: contract
        name: Compile canonical protected profile admission
        uses: ltn-it/modulix-validation/.github/actions/admit-incus-profile@83fd5f34b99d379ec4952bfc26243e8856f1e26f
        with:
          operating-case: ${{ inputs['operating-case'] }}
          profile: ${{ inputs.profile }}
          matrix-json: ${{ inputs['matrix-json'] }}
          source-sha: ${{ inputs['source-sha'] }}
          source-repository: ${{ inputs['source-repository'] || github.repository }}
          candidate-artifact: ${{ inputs['candidate-artifact'] }}
          cpu-limit: ${{ inputs['cpu-limit'] }}
          memory-limit: ${{ inputs['memory-limit'] }}
          disk-limit: ${{ inputs['disk-limit'] }}

  profile-cells:
    name: ${{ inputs.profile }} / ${{ matrix.scenario }} / ${{ matrix.target }}
    needs: validate-inputs
    if: needs.validate-inputs.outputs.profile != 'operating'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.validate-inputs.outputs.matrix-json) }}
    runs-on:
      group: ${{ needs.validate-inputs.outputs.worker-group }}
      labels:
        - self-hosted
        - linux
        - x64
        - lit-pis
        - prd
        - isolated
        - ciwkr01
    environment:
      name: heavy-isolated-pilot
    timeout-minutes: 90
    concurrency:
      # A shared group can retain only one pending job; later collection
      # requests otherwise cancel an already queued required profile. Runner
      # capacity still serializes jobs that target the same physical worker.
      # The Runner service stays on ciwkr01; Incus VMs are the disposable test targets.
      group: >-
        modulix-validation-incus-${{ github.repository_id }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ inputs.profile }}-${{ matrix.scenario }}-${{
        matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Run prepared Incus cell through the installed host runtime
        uses: ltn-it/modulix-validation/.github/actions/run-incus-runtime-profile@4126ba6c0c3137d3970f8d26a36f5128ad8fd563
        with:
          profile: ${{ needs.validate-inputs.outputs.profile }}
          scenario: ${{ matrix.scenario }}
          target: ${{ matrix.target }}
          target-disposition: ${{ matrix.target_disposition }}
          roles: ${{ join(matrix.roles, ',') }}
          image: ${{ matrix.image || vars[matrix.image_variable] }}
          instance-type: ${{ matrix.instance_type }}
          candidate-artifact: ${{ inputs['candidate-artifact'] }}
          source-sha: ${{ inputs['source-sha'] }}
          junit-required: ${{ matrix.junit }}
          allure-required: ${{ matrix.allure }}
          cpu-limit: ${{ inputs['cpu-limit'] }}
          memory-limit: ${{ inputs['memory-limit'] }}
          disk-limit: ${{ inputs['disk-limit'] }}

  profile-results:
    name: Final quality / ${{ inputs.profile }} / ${{ matrix.scenario }} / ${{ matrix.target }}
    needs: [validate-inputs, profile-cells]
    if: >-
      always() && needs.validate-inputs.result == 'success' &&
      (needs.validate-inputs.outputs.profile == 'heavy' ||
      needs.validate-inputs.outputs.profile == 'application_acceptance')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.validate-inputs.outputs.matrix-json) }}
    runs-on:
      group: ${{ needs.validate-inputs.outputs.worker-group }}
      labels:
        - self-hosted
        - linux
        - x64
        - lit-pis
        - prd
        - isolated
        - ciwkr01
    environment:
      name: heavy-isolated-pilot
    timeout-minutes: 90
    concurrency:
      group: >-
        modulix-validation-final-${{ github.repository_id }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ inputs.profile }}-${{ matrix.scenario }}-${{
        matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Observe the original cell only after its execution job ended
        uses: ltn-it/modulix-validation/.github/actions/observe-incus-runtime-profile@4126ba6c0c3137d3970f8d26a36f5128ad8fd563
        with:
          profile: ${{ needs.validate-inputs.outputs.profile }}
          scenario: ${{ matrix.scenario }}
          target: ${{ matrix.target }}

  operating-cell:
    name: Operating custody / ${{ needs.validate-inputs.outputs.operating-case }}
    needs: validate-inputs
    if: needs.validate-inputs.outputs.profile == 'operating'
    runs-on:
      group: ${{ needs.validate-inputs.outputs.worker-group }}
      labels:
        - self-hosted
        - linux
        - x64
        - lit-pis
        - prd
        - isolated
        - ciwkr01
    environment:
      name: heavy-isolated-pilot
    timeout-minutes: 15
    concurrency:
      group: >-
        modulix-validation-operating-${{ github.repository_id }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ needs.validate-inputs.outputs.operating-case }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Assert actual failure handling through the Root broker
        uses: ltn-it/modulix-validation/.github/actions/run-operating-drill@4126ba6c0c3137d3970f8d26a36f5128ad8fd563
        with:
          case: ${{ needs.validate-inputs.outputs.operating-case }}

  operating-results:
    name: Operating result / ${{ needs.validate-inputs.outputs.operating-case }}
    needs: [validate-inputs, operating-cell]
    if: >-
      always() && needs.validate-inputs.result == 'success' &&
      needs.validate-inputs.outputs.profile == 'operating'
    runs-on:
      group: ${{ needs.validate-inputs.outputs.worker-group }}
      labels:
        - self-hosted
        - linux
        - x64
        - lit-pis
        - prd
        - isolated
        - ciwkr01
    environment:
      name: heavy-isolated-pilot
    timeout-minutes: 15
    concurrency:
      group: >-
        modulix-validation-operating-result-${{ github.repository_id }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ needs.validate-inputs.outputs.operating-case }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Verify original custody after the real execution job ends
        uses: ltn-it/modulix-validation/.github/actions/observe-operating-drill@4126ba6c0c3137d3970f8d26a36f5128ad8fd563
        with:
          case: ${{ needs.validate-inputs.outputs.operating-case }}
