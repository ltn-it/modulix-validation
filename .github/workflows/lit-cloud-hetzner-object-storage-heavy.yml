# yamllint disable rule:truthy
---
name: lit.cloud Hetzner Object Storage Heavy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ansible-collection-cloud candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lit-cloud-hetzner-object-storage-heavy
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: lightning-it/ansible-collection-cloud
  PYTHON_VERSION: "3.11"
  ANSIBLE_CORE_VERSION: "2.18.18"

jobs:
  prepare:
    name: Validate candidate and Heavy matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - id: matrix
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          matrix="$(python3 - <<'PY'
          import json
          from pathlib import Path

          import yaml

          path = Path("inventories/heavy/hetzner-object-storage.yml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == 1
          assert payload["source_repository"] == "lightning-it/ansible-collection-cloud"
          cells = payload["matrix"]["include"]
          assert isinstance(cells, list) and cells
          print(json.dumps({"include": cells}, separators=(",", ":")))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build exact candidate artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.LIT_REPOSITORY_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ansible-core==${ANSIBLE_CORE_VERSION}"
          mkdir -p dist/candidate
          ansible-galaxy collection build --output-path dist/candidate --force
          (cd dist/candidate && sha256sum -- *.tar.gz > candidate-SHA256SUMS && sha256sum --check candidate-SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloud-candidate-${{ inputs.source_sha }}
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 30

  heavy:
    name: Central Hetzner Heavy matrix
    needs: [prepare, build]
    uses: ./.github/workflows/collection-molecule-profile.yml
    with:
      profile: heavy
      matrix-json: ${{ needs.prepare.outputs.matrix }}
      candidate-artifact: cloud-candidate-${{ inputs.source_sha }}
      source-sha: ${{ inputs.source_sha }}
      source-repository: lightning-it/ansible-collection-cloud
      collection-namespace: lit
      collection-name: cloud
      environment-name: lit-cloud-hetzner-object-storage-heavy
    secrets: inherit

  aggregate:
    name: lit.cloud / Hetzner Object Storage / Heavy
    if: always()
    needs: [prepare, build, heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HEAVY_RESULT: ${{ needs.heavy.result }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$HEAVY_RESULT" = success
          printf '%s\n' "candidate_sha=$SOURCE_SHA" "result=passed" > heavy-aggregate.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lit-cloud-hetzner-heavy-${{ inputs.source_sha }}
          path: heavy-aggregate.txt
          if-no-files-found: error
          retention-days: 30
