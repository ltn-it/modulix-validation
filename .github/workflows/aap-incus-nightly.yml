---
name: AAP Incus Nightly Matrix

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      matrix_filter:
        description: "Optional comma-separated matrix names, for example: aap27-rhel10"
        required: false
        default: ""
      destroy_instances:
        description: "Destroy Incus test VMs after each run"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aap-incus-nightly
  cancel-in-progress: false

jobs:
  prepare-matrix:
    name: Prepare AAP matrix
    timeout-minutes: 15
    runs-on:
      - self-hosted
      - linux
      - x64
      - incus
      - nested-virt
      - aap

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      rhsm_org: ${{ steps.matrix.outputs.rhsm_org }}
      destroy_instances: ${{ steps.matrix.outputs.destroy_instances }}

    steps:
      - name: Checkout validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: modulix-validation
          persist-credentials: false

      - name: Mint least-privilege source checkout token
        id: source-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ansible-collection-supplementary
            ansible-collection-ubuntu
            modulix-automation
          permission-contents: read

      - name: Checkout automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/modulix-automation
          path: modulix-automation
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Checkout supplementary collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/ansible-collection-supplementary
          path: ansible-collection-supplementary
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Checkout Ubuntu collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/ansible-collection-ubuntu
          path: ansible-collection-ubuntu
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Build matrix from validation inventory
        id: matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MATRIX_FILTER: ${{ inputs.matrix_filter || '' }}
          DESTROY_INSTANCES_INPUT: ${{ inputs.destroy_instances }}
        run: |
          set -euo pipefail

          destroy_instances="true"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            destroy_instances="${DESTROY_INSTANCES_INPUT}"
          fi

          python3 - <<'PY'
          import importlib.util
          import subprocess
          import sys

          if importlib.util.find_spec("yaml") is None:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--user", "PyYAML==6.0.2"]
              )
          PY

          matrix_json="$(
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          matrix_file = Path(
              "modulix-validation/inventories/nightly/host_vars/"
              "ciwkr01.prd.dmz.corp.l-it.io/aap_ci_matrix.yml"
          )
          data = yaml.safe_load(matrix_file.read_text(encoding="utf-8"))
          default_project = data.get("aap_ci_incus_project", "default")
          entries = [
              {
                  **entry,
                  "incus_project": entry.get("incus_project", default_project),
              }
              for entry in data["aap_ci_test_matrix"]
              if entry.get("enabled", True)
          ]

          matrix_filter = os.environ.get("MATRIX_FILTER", "").strip()
          if matrix_filter:
              wanted = {item.strip() for item in matrix_filter.split(",") if item.strip()}
              entries = [entry for entry in entries if entry["name"] in wanted]

          if not entries:
              raise SystemExit("No AAP CI matrix entries selected.")

          print(json.dumps({"include": entries}, separators=(",", ":")))
          PY
          )"

          rhsm_org="$(
            python3 - <<'PY'
          from pathlib import Path

          import yaml

          matrix_file = Path(
              "modulix-validation/inventories/nightly/host_vars/"
              "ciwkr01.prd.dmz.corp.l-it.io/aap_ci_matrix.yml"
          )
          data = yaml.safe_load(matrix_file.read_text(encoding="utf-8"))
          print(data["aap_ci_rhsm_org"])
          PY
          )"

          {
            printf 'matrix=%s\n' "${matrix_json}"
            printf 'rhsm_org=%s\n' "${rhsm_org}"
            printf 'destroy_instances=%s\n' "${destroy_instances}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sync runner artifacts from object storage
        env:
          AAP_26_BUNDLE_URL: ${{ secrets.AAP_26_BUNDLE_URL }}
          AAP_26_BUNDLE_SHA256: ${{ secrets.AAP_26_BUNDLE_SHA256 }}
          AAP_27_BUNDLE_URL: ${{ secrets.AAP_27_BUNDLE_URL }}
          AAP_27_BUNDLE_SHA256: ${{ secrets.AAP_27_BUNDLE_SHA256 }}
          RHEL_9_INCUS_METADATA_URL: ${{ secrets.RHEL_9_INCUS_METADATA_URL }}
          RHEL_9_INCUS_METADATA_SHA256: ${{ secrets.RHEL_9_INCUS_METADATA_SHA256 }}
          RHEL_9_INCUS_QCOW2_URL: ${{ secrets.RHEL_9_INCUS_QCOW2_URL }}
          RHEL_9_INCUS_QCOW2_SHA256: ${{ secrets.RHEL_9_INCUS_QCOW2_SHA256 }}
          RHEL_10_INCUS_METADATA_URL: ${{ secrets.RHEL_10_INCUS_METADATA_URL }}
          RHEL_10_INCUS_METADATA_SHA256: ${{ secrets.RHEL_10_INCUS_METADATA_SHA256 }}
          RHEL_10_INCUS_QCOW2_URL: ${{ secrets.RHEL_10_INCUS_QCOW2_URL }}
          RHEL_10_INCUS_QCOW2_SHA256: ${{ secrets.RHEL_10_INCUS_QCOW2_SHA256 }}
        run: |
          set -euo pipefail

          required_vars=(
            AAP_26_BUNDLE_URL
            AAP_26_BUNDLE_SHA256
            AAP_27_BUNDLE_URL
            AAP_27_BUNDLE_SHA256
            RHEL_9_INCUS_METADATA_URL
            RHEL_9_INCUS_METADATA_SHA256
            RHEL_9_INCUS_QCOW2_URL
            RHEL_9_INCUS_QCOW2_SHA256
            RHEL_10_INCUS_METADATA_URL
            RHEL_10_INCUS_METADATA_SHA256
            RHEL_10_INCUS_QCOW2_URL
            RHEL_10_INCUS_QCOW2_SHA256
          )

          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              missing_vars+=("${var_name}")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            echo "Skipping artifact sync because object-storage secrets are incomplete:"
            printf '  %s\n' "${missing_vars[@]}"
            exit 0
          fi

          ansible_core_version="${AAP_CI_ANSIBLE_CORE_VERSION:-2.18.14}"
          venv_dir="${RUNNER_TEMP}/aap-artifact-sync-ansible-${ansible_core_version}"
          if [ ! -x "${venv_dir}/bin/ansible-playbook" ]; then
            python3 -m venv "${venv_dir}"
            "${venv_dir}/bin/python" -m pip install --upgrade pip
            "${venv_dir}/bin/python" -m pip install \
              "ansible-core==${ansible_core_version}" \
              jmespath \
              PyYAML
          fi
          export PATH="${venv_dir}/bin:${PATH}"

          collections_dir="${RUNNER_TEMP}/aap-artifact-sync-collections"
          mkdir -p "${collections_dir}/ansible_collections/lit"
          ln -sfn "${GITHUB_WORKSPACE}/ansible-collection-supplementary" \
            "${collections_dir}/ansible_collections/lit/supplementary"
          ln -sfn "${GITHUB_WORKSPACE}/ansible-collection-ubuntu" \
            "${collections_dir}/ansible_collections/lit/ubuntu"
          export ANSIBLE_COLLECTIONS_PATH="${collections_dir}"

          ansible-playbook \
            -i modulix-validation/inventories/nightly/inventory.yml \
            modulix-automation/ansible/runbooks/40-platforms/incus/20-image-artifacts.yml

      - name: Preflight runner artifacts
        env:
          MATRIX_FILTER: ${{ inputs.matrix_filter || '' }}
          RH_AUTOMATION_HUB_TOKEN: ${{ secrets.RH_AUTOMATION_HUB_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${RH_AUTOMATION_HUB_TOKEN}"

          python3 - <<'PY' > /tmp/aap-incus-preflight.tsv
          import os
          from pathlib import Path

          import yaml

          matrix_file = Path(
              "modulix-validation/inventories/nightly/host_vars/"
              "ciwkr01.prd.dmz.corp.l-it.io/aap_ci_matrix.yml"
          )
          data = yaml.safe_load(matrix_file.read_text(encoding="utf-8"))
          default_project = data.get("aap_ci_incus_project", "default")
          entries = [
              entry
              for entry in data["aap_ci_test_matrix"]
              if entry.get("enabled", True)
          ]

          matrix_filter = os.environ.get("MATRIX_FILTER", "").strip()
          if matrix_filter:
              wanted = {item.strip() for item in matrix_filter.split(",") if item.strip()}
              entries = [entry for entry in entries if entry["name"] in wanted]

          for entry in entries:
              print(
                  "\t".join(
                      [
                          entry["name"],
                          entry.get("incus_project", default_project),
                          entry["incus_image"],
                          entry["aap_bundle_file"],
                      ]
                  )
              )
          PY

          while IFS=$'\t' read -r matrix_name incus_project incus_image bundle_file; do
            echo "Preflight ${matrix_name}"
            incus --force-local --project "${incus_project}" image info "${incus_image}" >/dev/null
            test -r "${bundle_file}"
          done < /tmp/aap-incus-preflight.tsv

  aap-incus:
    name: ${{ matrix.name }}
    timeout-minutes: 330
    needs:
      - prepare-matrix
    runs-on:
      - self-hosted
      - linux
      - x64
      - incus
      - nested-virt
      - aap

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: modulix-validation
          persist-credentials: false

      - name: Mint least-privilege source checkout token
        id: source-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ansible-collection-foundational
            ansible-collection-rhel
            ansible-collection-supplementary
            ansible-collection-ubuntu
            modulix-automation
          permission-contents: read

      - name: Checkout automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/modulix-automation
          path: modulix-automation
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Checkout foundational collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/ansible-collection-foundational
          path: ansible-collection-foundational
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Checkout RHEL collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/ansible-collection-rhel
          path: ansible-collection-rhel
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Checkout supplementary collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/ansible-collection-supplementary
          path: ansible-collection-supplementary
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Checkout Ubuntu collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/ansible-collection-ubuntu
          path: ansible-collection-ubuntu
          token: ${{ steps.source-app.outputs.token }}
          persist-credentials: false

      - name: Run AAP Incus matrix entry
        env:
          MATRIX_NAME: ${{ matrix.name }}
          AAP_VERSION: ${{ matrix.aap_version }}
          RHEL_MAJOR: ${{ matrix.rhel_major }}
          INCUS_IMAGE: ${{ matrix.incus_image }}
          INCUS_VM_CPU: ${{ matrix.incus_vm_cpu || '4' }}
          INCUS_VM_MEMORY: ${{ matrix.incus_vm_memory || '20GiB' }}
          INCUS_VM_ROOT_SIZE: ${{ matrix.incus_vm_root_size || '70GiB' }}
          AAP_BUNDLE_FILE: ${{ matrix.aap_bundle_file }}
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID || needs.prepare-matrix.outputs.rhsm_org }}
          RHSM_ACTIVATION_KEY: ${{ matrix.rhsm_activation_key }}
          RH_AUTOMATION_HUB_TOKEN: ${{ secrets.RH_AUTOMATION_HUB_TOKEN }}
          AAP_CI_ADMIN_PASSWORD: ${{ secrets.AAP_CI_ADMIN_PASSWORD }}
          AAP_CI_DESTROY_INSTANCE: ${{ needs.prepare-matrix.outputs.destroy_instances }}
          AAP_CI_INCUS_PROJECT: ${{ matrix.incus_project || 'default' }}
          AAP_CI_HOST_MEMORY_HEADROOM_MIB: ${{ matrix.host_memory_headroom_mib || '4096' }}
          AUTOMATION_DIR: ${{ github.workspace }}/modulix-automation
          SUPPLEMENTARY_DIR: ${{ github.workspace }}/ansible-collection-supplementary
          UBUNTU_DIR: ${{ github.workspace }}/ansible-collection-ubuntu
          AAP_CI_WORK_DIR: ${{ runner.temp }}/aap-incus-ci/${{ matrix.name }}
        run: |
          set -euo pipefail
          modulix-validation/.github/scripts/aap-incus-matrix-run.sh
