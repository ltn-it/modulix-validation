---
name: Run collection quality profile
description: Run one registry-selected Molecule cell against the exact collection candidate.

inputs:
  profile:
    description: Quality profile name.
    required: true
  scenario:
    description: Molecule scenario name.
    required: true
  target:
    description: Registry target name.
    required: true
  target-disposition:
    description: Registry target disposition; candidate runs can never produce release evidence.
    required: false
    default: supported
  roles:
    description: Comma-separated roles covered by this scenario.
    required: true
  image:
    description: Resolved Incus image.
    required: true
  instance-type:
    description: Container only; VMs reject before candidate effects until a remote-aware producer lifecycle is qualified.
    required: true
  candidate-artifact:
    description: Name of the exact collection candidate artifact.
    required: true
  source-sha:
    description: Reviewed source commit represented by the candidate and evidence.
    required: true
  junit-required:
    description: Whether the registry requires a unique scenario JUnit report.
    required: true
  allure-required:
    description: Whether the registry requires final Allure results.
    required: true
  cpu-limit:
    description: Incus CPU limit.
    required: true
  memory-limit:
    description: Incus memory limit.
    required: true
  disk-limit:
    description: Incus root disk limit.
    required: true

runs:
  using: composite
  steps:
    - name: Require approved dispatcher and Incus transport before candidate effects
      shell: bash
      env:
        QUALITY_ACTION_ROOT: ${{ github.action_path }}
        QUALITY_ACTION_REPOSITORY: ${{ github.action_repository }}
        QUALITY_ACTION_REF: ${{ github.action_ref }}
        QUALITY_CONTROLLER_SHA: ${{ github.sha }}
        QUALITY_INPUT_PROFILE: ${{ inputs.profile }}
        QUALITY_INPUT_SCENARIO: ${{ inputs.scenario }}
        QUALITY_INPUT_TARGET: ${{ inputs.target }}
        QUALITY_INPUT_TARGET_DISPOSITION: ${{ inputs.target-disposition }}
        QUALITY_INPUT_ROLES: ${{ inputs.roles }}
        QUALITY_INPUT_IMAGE: ${{ inputs.image }}
        QUALITY_INPUT_INSTANCE_TYPE: ${{ inputs.instance-type }}
        QUALITY_INPUT_CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
        QUALITY_INPUT_SOURCE_SHA: ${{ inputs.source-sha }}
        QUALITY_INPUT_JUNIT_REQUIRED: ${{ inputs.junit-required }}
        QUALITY_INPUT_ALLURE_REQUIRED: ${{ inputs.allure-required }}
        QUALITY_INPUT_CPU_LIMIT: ${{ inputs.cpu-limit }}
        QUALITY_INPUT_MEMORY_LIMIT: ${{ inputs.memory-limit }}
        QUALITY_INPUT_DISK_LIMIT: ${{ inputs.disk-limit }}
      run: bash "$QUALITY_ACTION_ROOT/run-devtools.sh" check

    - name: Download exact collection candidate
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
      with:
        name: ${{ inputs.candidate-artifact }}
        path: >-
          ${{ runner.temp }}/supplementary-candidate/${{ github.repository_id }}/${{
          github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/${{ github.sha }}

    - name: Run complete cell inside approved pinned Devtools
      id: cell
      shell: bash
      env:
        QUALITY_ACTION_ROOT: ${{ github.action_path }}
        QUALITY_ACTION_REPOSITORY: ${{ github.action_repository }}
        QUALITY_ACTION_REF: ${{ github.action_ref }}
        QUALITY_CONTROLLER_SHA: ${{ github.sha }}
        QUALITY_INPUT_PROFILE: ${{ inputs.profile }}
        QUALITY_INPUT_SCENARIO: ${{ inputs.scenario }}
        QUALITY_INPUT_TARGET: ${{ inputs.target }}
        QUALITY_INPUT_TARGET_DISPOSITION: ${{ inputs.target-disposition }}
        QUALITY_INPUT_ROLES: ${{ inputs.roles }}
        QUALITY_INPUT_IMAGE: ${{ inputs.image }}
        QUALITY_INPUT_INSTANCE_TYPE: ${{ inputs.instance-type }}
        QUALITY_INPUT_CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
        QUALITY_INPUT_SOURCE_SHA: ${{ inputs.source-sha }}
        QUALITY_INPUT_JUNIT_REQUIRED: ${{ inputs.junit-required }}
        QUALITY_INPUT_ALLURE_REQUIRED: ${{ inputs.allure-required }}
        QUALITY_INPUT_CPU_LIMIT: ${{ inputs.cpu-limit }}
        QUALITY_INPUT_MEMORY_LIMIT: ${{ inputs.memory-limit }}
        QUALITY_INPUT_DISK_LIMIT: ${{ inputs.disk-limit }}
      run: bash "$QUALITY_ACTION_ROOT/run-devtools.sh" run

    - name: Upload unique matrix evidence
      id: upload
      if: always() && steps.cell.outputs.package-directory != '' && steps.cell.outputs.result-artifact != ''
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
      with:
        name: ${{ steps.cell.outputs.result-artifact }}
        path: ${{ steps.cell.outputs.package-directory }}
        if-no-files-found: error
        retention-days: 30

    - name: Enforce actual cell and artifact outcomes
      if: always()
      shell: bash
      env:
        CELL_OUTCOME: ${{ steps.cell.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
      run: |
        set -euo pipefail
        test "$CELL_OUTCOME" = success
        test "$UPLOAD_OUTCOME" = success
