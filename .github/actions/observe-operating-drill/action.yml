---
name: Observe actual post-job operating custody
description: Read original case retention after its native execution job ended, without a new lease.
inputs:
  case:
    required: true
    description: Original closed operating case.
runs:
  using: composite
  steps:
    - name: Check the installed operating broker client
      shell: bash
      run: |
        set -euo pipefail
        runtime_contract="$(/usr/libexec/lightning-it/incus-runtime-client check --require-capability initial-auth-idle-v1)"
        # The installed CLI emits this closed canonical record. Do not accept a
        # legacy local check, extra fields, duplicate keys or a remote-health claim.
        expected_contract='{"authentication_idle_seconds":60,"capabilities":["initial-auth-idle-v1"],'
        expected_contract+='"frame_seconds":5,"operation":"check","schema":2,"state":"local-prerequisites-only"}'
        if [[ "$runtime_contract" != "$expected_contract" ]]; then
          echo 'Installed Root client authentication-wait contract is unavailable.' >&2
          exit 1
        fi
    - name: Verify original case custody after actual native completion
      id: operating
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        OPERATING_CASE: ${{ inputs.case }}
      run: |
        set -euo pipefail
        exec /usr/libexec/lightning-it/incus-runtime-client observe-operating --case "$OPERATING_CASE"
    - name: Publish actual retained-case metadata
      id: upload
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ steps.operating.outputs.operating-artifact }}
        path: ${{ steps.operating.outputs.operating-receipt }}
        if-no-files-found: error
        retention-days: 30
    - name: Require verified retention and publication without quality PASS
      if: always()
      shell: bash
      env:
        OPERATING_OUTCOME: ${{ steps.operating.outcome }}
        OPERATING_STATE: ${{ steps.operating.outputs.operating-state }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
      run: |
        set -euo pipefail
        test "$OPERATING_OUTCOME" = success
        test "$OPERATING_STATE" = retained
        test "$UPLOAD_OUTCOME" = success
